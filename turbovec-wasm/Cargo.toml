[package]
name = "turbovec-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
turbovec = { path = "../turbovec" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
